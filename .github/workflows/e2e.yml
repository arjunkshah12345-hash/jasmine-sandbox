name: e2e
on:
  push:
  workflow_dispatch:
    inputs:
      samples: { description: "samples per metric", default: "100" }
      burst: { description: "concurrent creates", default: "20" }
      image: { description: "template image", default: "python:3.12-slim" }
      compare_samples: { description: "samples per provider in the comparison", default: "10" }

jobs:
  firecracker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host info
        run: |
          nproc; free -h; uname -r; ls -l /dev/kvm
          grep -m1 'model name' /proc/cpuinfo || true
      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo test -q -p jasmine-proto
          cargo build -q --release -p jasmine-agent --target x86_64-unknown-linux-musl
          cargo build -q --release -p jasmined
          ls -la target/x86_64-unknown-linux-musl/release/jasmine-agent target/release/jasmined
      - name: Set up host (Firecracker, kernel, XFS reflink data dir)
        run: |
          sudo JASMINE_XFS_IMG=$( [ -d /mnt ] && echo /mnt/jasmine-xfs.img || echo /var/jasmine-xfs.img ) dev/setup-host.sh
          sudo install -D -m 0755 target/x86_64-unknown-linux-musl/release/jasmine-agent /usr/local/lib/jasmine/jasmine-agent
          sudo install -m 0755 target/release/jasmined /usr/local/bin/jasmined
      - name: Build template
        run: |
          time sudo jasmined build default "${{ inputs.image || 'python:3.12-slim' }}"
          time sudo jasmined build noprewarm "${{ inputs.image || 'python:3.12-slim' }}" --prewarm-mib 0
      - name: Start daemon
        run: |
          sudo bash -c 'nohup jasmined serve > /tmp/jasmined.log 2>&1 &'
          for i in $(seq 100); do curl -fs localhost:7171/healthz && break; sleep 0.1; done
      - name: E2E checks + benchmark
        run: node bench/jasmine-e2e.mjs --samples "${{ inputs.samples || '100' }}" --burst "${{ inputs.burst || '20' }}" --out results.json
      - name: SDK smoke tests
        run: |
          (cd sdk/typescript && npm install --silent --no-audit --no-fund && npm run --silent build)
          node sdk/smoke.mjs
          python3 sdk/smoke.py
      - name: S3 mounts (against an S3 server in its own network namespace)
        run: |
          # rclone serve s3 stands in for S3, reached through the host like the internet.
          sudo ip netns add s3
          sudo ip link add s3h type veth peer name s3n netns s3
          sudo ip addr add 10.99.0.1/30 dev s3h && sudo ip link set s3h up
          sudo ip -n s3 addr add 10.99.0.2/30 dev s3n && sudo ip -n s3 link set s3n up && sudo ip -n s3 link set lo up
          sudo ip -n s3 route add default via 10.99.0.1
          sudo mkdir -p /tmp/s3data/jasmine-test && echo "hello from s3" | sudo tee /tmp/s3data/jasmine-test/hello.txt >/dev/null
          sudo ip netns exec s3 sh -c 'nohup /usr/local/lib/jasmine/rclone serve s3 /tmp/s3data --addr 10.99.0.2:9000 --auth-key jasmine,jasmine-secret >/tmp/s3serve.log 2>&1 &'
          for i in $(seq 40); do curl -s -o /dev/null http://10.99.0.2:9000/ && break; sleep 0.25; done
          S3_ENDPOINT=http://10.99.0.2:9000 S3_KEY=jasmine S3_SECRET=jasmine-secret node sdk/s3-smoke.mjs || { sudo tail -30 /tmp/s3serve.log; curl -s -X POST localhost:7171/v1/sandboxes -d '{}' -H 'content-type: application/json' | python3 -c 'import json,sys,urllib.request as u; i=json.load(sys.stdin)["id"]; r=u.Request(f"http://localhost:7171/v1/sandboxes/{i}/exec", json.dumps({"cmd": "ls -l /dev/fuse /usr/local/bin/fuser* /.jasmine; grep -i fuse /proc/filesystems /proc/misc"}).encode(), {"content-type": "application/json"}); print(u.urlopen(r).read().decode())'; exit 1; }
      - name: Outbound IPv6 (through a stand-in IPv6 internet; the host stays unreachable)
        run: |
          sudo ip netns add inet6
          sudo ip link add inet6h type veth peer name inet6n netns inet6
          sudo ip addr add 2001:db8:6a73::1/64 dev inet6h nodad && sudo ip link set inet6h up
          sudo ip -n inet6 link set lo up
          sudo ip -n inet6 addr add 2001:db8:6a73::2/64 dev inet6n nodad && sudo ip -n inet6 link set inet6n up
          sudo ip -n inet6 -6 route add default via 2001:db8:6a73::1
          mkdir -p /tmp/www && echo v6-ok > /tmp/www/index.html
          sudo ip netns exec inet6 sh -c 'cd /tmp/www && nohup python3 -m http.server 8080 --bind 2001:db8:6a73::2 >/dev/null 2>&1 &'
          nohup python3 -m http.server 8081 --bind 2001:db8:6a73::1 --directory /tmp/www >/dev/null 2>&1 &
          sleep 1
          sudo grep -i ipv6 /tmp/jasmined.log || true
          if ! node sdk/ipv6-smoke.mjs; then
            set -x
            ns=$(sudo ip netns list | awk '{print $1}' | grep '^wrn' | sort -V | head -1); k=${ns#wrn}
            hip=$(sudo ip -6 -o addr show dev wrv$k scope global | awk '{print $4}' | cut -d/ -f1)
            sudo sysctl net.ipv6.conf.wrv$k.forwarding net.ipv6.conf.inet6h.forwarding net.ipv6.conf.default.forwarding
            sudo timeout 8 tcpdump -lni wrv$k -c 12 ip6 & tpid=$!
            sleep 1
            sudo ip netns exec $ns ping -6 -c2 -W2 $hip || true
            sudo ip netns exec $ns ping -6 -c2 -W2 2001:db8:6a73::2 || true
            wait $tpid || true
            sudo ip netns exec $ns ip -6 neigh; sudo ip -6 neigh show dev wrv$k
            sudo ip netns exec $ns nstat -az | grep -E 'Ip6(Out|In)(NoRoutes|Discards|Requests|AddrErrors)|Icmp6OutDestUnreachs' || true
            sudo nstat -az | grep -E 'Ip6(Out|In)(NoRoutes|Discards|Requests|AddrErrors|ForwDatagrams)|Icmp6OutDestUnreachs' || true
            sudo ip6tables -t raw -S; sudo ip6tables -t mangle -S
            sudo nft list ruleset | grep -vE '^\s*$' | head -150
            exit 1
          fi
      - name: Browser template (Chromium captured running; CDP over the preview URL)
        run: |
          time sudo jasmined build browser chromedp/headless-shell:stable --mem-mib 2048 --ready-port 9222 \
            --start '/headless-shell/headless-shell --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --remote-allow-origins=* about:blank'
          node sdk/browser-smoke.mjs
      - name: Cross-provider comparison (providers without secrets are skipped)
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          (cd bench/compare && npm install --silent --no-audit --no-fund)
          node bench/compare/run.mjs --samples "${{ inputs.compare_samples || '10' }}" --out results-compare.json
      - name: A/B without page-cache prewarm
        run: JASMINE_TEMPLATE=noprewarm node bench/jasmine-e2e.mjs --samples 30 --burst 5 --out results-noprewarm.json
      - name: Concurrency A/B (guest shape)
        run: |
          IMG="${{ inputs.image || 'python:3.12-slim' }}"
          sudo jasmined build c1m512 "$IMG" --vcpus 1 --mem-mib 512 >/dev/null
          sudo jasmined build c2m512 "$IMG" --vcpus 2 --mem-mib 512 >/dev/null
          sudo jasmined build c1m1024 "$IMG" --vcpus 1 --mem-mib 1024 >/dev/null
          for t in default c1m512 c2m512 c1m1024; do node bench/burst.mjs $t 1 2 5 10; done
      - name: Host load during a burst
        run: |
          (vmstat 1 6 > /tmp/vmstat.txt) &
          node -e '
            const U="http://127.0.0.1:7171", j={"content-type":"application/json"};
            (async()=>{ const xs=await Promise.all(Array.from({length:20},()=>fetch(U+"/v1/sandboxes",{method:"POST",headers:j,body:"{}"}).then(r=>r.json())));
              await new Promise(r=>setTimeout(r,3000));
              await Promise.all(xs.map(x=>fetch(U+"/v1/sandboxes/"+x.id,{method:"DELETE"}))); })()'
          wait; cat /tmp/vmstat.txt
      - name: Page-fault profile of one restore
        run: |
          id=$(curl -fs -XPOST localhost:7171/v1/sandboxes -d '{}' -H 'content-type: application/json' | jq -r .id)
          echo "after restore:";   ps -o min_flt,maj_flt,rss,etimes -C firecracker
          curl -fs localhost:7171/v1/sandboxes/$id/exec -H 'content-type: application/json' -d '{"cmd":["true"]}' | jq -c .
          echo "after 1st exec:";  ps -o min_flt,maj_flt,rss -C firecracker
          curl -fs localhost:7171/v1/sandboxes/$id/exec -H 'content-type: application/json' -d '{"cmd":["true"]}' | jq -c .
          echo "after 2nd exec:";  ps -o min_flt,maj_flt,rss -C firecracker
          curl -fs localhost:7171/v1/sandboxes/$id/exec -H 'content-type: application/json' -d '{"cmd":"cat /proc/loadavg; dmesg | tail -5"}' | jq -r .stdout
      - name: File API latency probe (1 KiB write vs read, and exec for reference)
        run: |
          J='content-type: application/json'; U=localhost:7171
          id=$(curl -fs -XPOST $U/v1/sandboxes -H "$J" -d '{}' | jq -r .id)
          head -c 1024 /dev/urandom > /tmp/1k
          t() { for i in $(seq 20); do "$@"; done | sort -n | awk '{a[NR]=$1} END {printf "p50=%.1fms min=%.1fms\n", a[int(NR/2)+1]*1000, a[1]*1000}'; }
          echo -n "PUT 1KiB  "; t curl -s -o /dev/null -w '%{time_total}\n' -X PUT --data-binary @/tmp/1k "$U/v1/sandboxes/$id/files?path=/workspace/x"
          echo -n "GET 1KiB  "; t curl -s -o /dev/null -w '%{time_total}\n' "$U/v1/sandboxes/$id/files?path=/workspace/x"
          echo -n "exec true "; t curl -s -o /dev/null -w '%{time_total}\n' -H "$J" -d '{"cmd":["true"]}' "$U/v1/sandboxes/$id/exec"
          echo -n "GET sbx   "; t curl -s -o /dev/null -w '%{time_total}\n' "$U/v1/sandboxes/$id"
          echo "first vs second 1 KiB write+read on fresh sandboxes (ms):"
          for n in 1 2 3 4 5; do
            s=$(curl -fs -XPOST $U/v1/sandboxes -H "$J" -d '{}' | jq -r .id)
            curl -fs -o /dev/null -H "$J" -d '{"cmd":["true"]}' "$U/v1/sandboxes/$s/exec"
            for k in first second; do
              a=$(curl -s -o /dev/null -w '%{time_total}' -X PUT --data-binary @/tmp/1k "$U/v1/sandboxes/$s/files?path=/workspace/rt-$k.bin")
              b=$(curl -s -o /dev/null -w '%{time_total}' "$U/v1/sandboxes/$s/files?path=/workspace/rt-$k.bin")
              echo "  $k: put ${a}s get ${b}s"
            done
            curl -fs -XDELETE "$U/v1/sandboxes/$s"
          done
      - name: Guest network/process probe
        if: always()
        run: |
          J='content-type: application/json'; U=localhost:7171
          id=$(curl -fs -XPOST $U/v1/sandboxes -H "$J" -d '{}' | jq -r .id)
          ex() { curl -s $U/v1/sandboxes/$id/exec -H "$J" -d "$(jq -n --arg c "$1" '{cmd:$c, timeout_ms:20000}')" | jq -r '.stdout + .stderr + "exit=" + (.exit_code|tostring)'; }
          ex 'mkdir -p /tmp/s && cd /tmp/s && echo hi > index.html && (setsid python3 -u -m http.server 3000 --bind 127.0.0.1 > /tmp/h.log 2>&1 < /dev/null &) ; sleep 2; echo "--log"; cat /tmp/h.log; echo "--ps"; ps -ef 2>/dev/null || ls /proc | grep -E "^[0-9]+$" | head -50; echo "--tcp"; cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | head; echo "--ip"; cat /proc/net/if_inet6 2>/dev/null; ls /sys/class/net; cat /sys/class/net/lo/operstate'
          ex 'python3 -c "import urllib.request as u; print(u.urlopen(\"http://127.0.0.1:3000/\", timeout=3).read())"'
          curl -s -o /dev/null -w 'proxy status %{http_code}\n' $U/v1/sandboxes/$id/ports/3000/
      - name: Diagnostics
        if: always()
        run: |
          echo "== jasmined log"; sudo tail -50 /tmp/jasmined.log || true
          echo "== template console"; sudo tail -c 4000 /var/lib/jasmine/templates/default/console.log || true
          for f in $(sudo ls -d /var/lib/jasmine/sandboxes/*/ 2>/dev/null | head -3); do echo "== $f"; sudo tail -c 2000 "$f/console.log"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results*.json
          if-no-files-found: ignore
