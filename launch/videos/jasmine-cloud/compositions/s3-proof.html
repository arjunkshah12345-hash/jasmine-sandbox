<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", sans-serif; color: #f4f5f0; background: #070807; }
    /* one card, centred: a live sandbox and what it costs, second by second */
    #s3-meter { position: absolute; left: 580px; top: 300px; width: 760px; height: 620px; padding: 60px 64px; border-radius: 28px; background: #0d0f0c;
      border: 2px solid rgba(244,245,240,.10); box-shadow: 0 40px 80px rgba(0,0,0,.55); overflow: hidden; }
    .lab { font-size: 32px; font-weight: 500; color: #6b7068; letter-spacing: -0.01em; }
    #s3-usd { margin-top: 60px; font-family: "Geist Mono", monospace; font-size: 104px; letter-spacing: -0.04em; color: #a6e86b; line-height: 1; font-variant-numeric: tabular-nums; }
    #s3-sec { margin-top: 24px; font-family: "Geist Mono", monospace; font-size: 34px; color: #f4f5f0; }
    #s3-rule { margin-top: 64px; height: 2px; background: rgba(244,245,240,.08); }
    #s3-state { margin-top: 44px; display: flex; align-items: center; gap: 22px; font-size: 46px; font-weight: 600; letter-spacing: -0.03em; }
    #s3-dot { width: 26px; height: 26px; border-radius: 50%; background: #a6e86b; box-sizing: border-box; }
    .s3-t { position: absolute; left: 0; right: 0; top: 100px; text-align: center; clip-path: inset(0 0 100% 0); font-size: 112px; font-weight: 600; letter-spacing: -0.05em; line-height: 1; padding-bottom: 16px; white-space: pre; }
    .s3-t .d { color: #6b7068; }
  </style>
  <div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
    <div id="tt0" class="s3-t">Ready in <span style="color:#a6e86b">0.09 s</span>.</div>
    <div id="tt1" class="s3-t">Billed by the second.</div>
    <div id="tt2" class="s3-t">Pause it. <span class="d">Memory kept.</span></div>
    <div id="tt3" class="s3-t">Pick up where you left off.</div>
    <div id="s3-meter">
      <div class="lab">your sandbox · 4 vCPU · 8 GiB</div>
      <div id="s3-usd">$0.0000000</div>
      <div id="s3-sec">0.0 s billed</div>
      <div id="s3-rule"></div>
      <div id="s3-state"><div id="s3-dot"></div><span id="s3-st">starting</span></div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const RATE = 0.030 / 3600;
      const RUN = [[0.9, 6.2], [9.6, 12.7]];
      const billed = (t) => RUN.reduce((s, [a, b]) => s + Math.max(0, Math.min(t, b) - a), 0);
      const usd = document.querySelector("#s3-usd"), sec = document.querySelector("#s3-sec");
      const st = document.querySelector("#s3-st"), dot = document.querySelector("#s3-dot");
      const clock = { t: 0 };
      const paint = () => {
        const t = clock.t, s = billed(t);
        const running = RUN.some(([a, b]) => t >= a && t < b);
        usd.textContent = "$" + (s * RATE).toFixed(7);
        sec.textContent = s.toFixed(1) + " s billed";
        usd.style.opacity = running || t < 0.9 ? 1 : 0.4;
        st.textContent = t < 0.9 ? "starting" : running ? "running" : "paused · memory kept";
        st.style.color = running ? "#f4f5f0" : "#6b7068";
        dot.style.background = running ? "#a6e86b" : "transparent";
        dot.style.border = running ? "none" : "3px solid #6b7068";
        dot.style.transform = running ? `scale(${1 + 0.18 * Math.max(0, Math.cos(t * Math.PI * 4))})` : "none";
      };
      paint();
      tl.fromTo(clock, { t: 0 }, { t: 12.7, duration: 12.7, ease: "none", onUpdate: paint, immediateRender: false }, 0);

      // the card settles in under the leaf as it dithers off
      tl.from("#s3-meter", { y: 50, scale: 0.96, duration: 0.6, ease: "expo.out" }, 0);

      // headlines swap on the bar; each stays up for about 2.7 s
      [0.0, 3.0, 6.0, 9.0].forEach((at, i) => {
        const id = "#tt" + i;
        tl.fromTo(id, { clipPath: "inset(0 0 100% 0)", y: 60 }, { clipPath: "inset(0 0 0% 0)", y: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, at + 0.05);
        tl.to(id, { clipPath: "inset(100% 0 0 0)", y: -40, duration: 0.25, ease: "power3.in" }, at + 2.75);
      });
      // a small press on the card as it pauses and resumes
      tl.fromTo("#s3-meter", { scale: 1 }, { scale: 0.975, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 6.2);
      tl.fromTo("#s3-meter", { scale: 1 }, { scale: 1.02, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 9.6);
      window.__timelines["s3"] = tl;
    })();
  </script>
</template>
