  <script>
    (() => {
      const C = window.CUES, tl = gsap.timeline({ paused: true });
      const IN = (el, at, from = { y: 24 }) => tl.fromTo(el, { opacity: 0, ...from }, { opacity: 1, y: 0, x: 0, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, at);
      const OUT = (el, at) => { tl.to(el, { opacity: 0, duration: 0.35, ease: "power2.in" }, at - 0.35); tl.set(el, { opacity: 0 }, at); };

      // cold open: the agent's diff, then laptop and production get struck out
      IN("#diff", C.open[0] + 0.3, { y: -20, scale: 0.96 });

      OUT("#diff", C.where[1] + 0.3);
      IN("#laptop", C.laptop[0], { y: 30, scale: 0.9 });
      IN("#prod", C.prod[0], { y: 30, scale: 0.9 });
      tl.fromTo("#laptop .st", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "expo.out", immediateRender: true }, C.laptop[1] + 0.05);
      tl.fromTo("#prod .st", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "expo.out", immediateRender: true }, C.prod[1] + 0.05);
      OUT("#laptop", C.name[0] - 0.2); OUT("#prod", C.name[0] - 0.2);

      // lower third
      IN("#lt", C.name[0] - 0.5, { x: -30, y: 0 });
      OUT("#lt", C.recap[0] + 2.2);

      // demo: headlines swap, the dashboard plays beside the speaker card
      const H = [["#h0", C.signin[0]], ["#h1", C.running[0]], ["#h2", C.pause[0]], ["#h3", C.fork[0]], ["#h4", C.price[0]], ["#h5", C.prepaid[0]]];
      H.forEach(([id, at], i) => {
        const out = i + 1 < H.length ? H[i + 1][1] : C.why[0] - 0.4;
        tl.fromTo(id, { clipPath: "inset(0 0 100% 0)", y: 40 }, { clipPath: "inset(0 0 0% 0)", y: 0, duration: 0.45, ease: "expo.out", immediateRender: false }, at);
        tl.to(id, { clipPath: "inset(100% 0 0 0)", y: -30, duration: 0.25, ease: "power3.in" }, out - 0.25);
      });
      IN("#app", C.signin[0] - 0.1, { x: 60, y: 0 });
      tl.set("#vk", { opacity: 1 }, C.signin[0] - 0.1);
      // the cursor travels to Create key and clicks
      tl.fromTo("#cur", { opacity: 0, x: 520, y: 440 }, { opacity: 1, x: 760, y: 190, duration: 0.6, ease: "power2.inOut", immediateRender: true }, C.signin[0] + 0.1);
      tl.to("#btn", { scale: 0.94, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, C.signin[0] + 0.72);
      IN("#key", C.signin[0] + 0.8, { y: 16 });
      tl.to("#cur", { opacity: 0, duration: 0.2 }, C.signin[0] + 1.3);
      tl.to("#vk", { opacity: 0, duration: 0.25 }, Math.max(C.running[0] + 0.25, C.signin[0] + 2.45));
      tl.set("#vs", { opacity: 1 }, Math.max(C.running[0] + 0.5, C.signin[0] + 2.7));
      tl.fromTo("#sbx", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", immediateRender: true }, Math.max(C.running[0] + 0.5, C.signin[0] + 2.7));

      // the meter: counts while running, freezes on pause
      const RATE = 0.030 / 3600, a0 = C.running[0] + 0.3, p0 = C.pause[1];
      const usd = document.getElementById("susd"), sec = document.getElementById("ssec"), st = document.getElementById("sst"), dot = document.getElementById("sdot");
      const clock = { t: 0 };
      const paint = () => {
        const t = clock.t, s = Math.max(0, Math.min(t, p0) - a0), paused = t >= p0;
        usd.textContent = "$" + (s * RATE).toFixed(7); sec.textContent = s.toFixed(1) + " s billed";
        usd.style.opacity = paused ? 0.4 : 1;
        st.textContent = paused ? "paused · memory kept" : "ready in 0.09 s · 4 vCPU · 8 GiB";
        dot.style.background = paused ? "transparent" : "#a6e86b"; dot.style.border = paused ? "3px solid #8a8f85" : "none";
      };
      paint();
      tl.fromTo(clock, { t: 0 }, { t: window.TOTAL, duration: window.TOTAL, ease: "none", onUpdate: paint, immediateRender: false }, 0);
      // fork: ten copies start from the paused one
      gsap.utils.toArray("#grid .fk").forEach((f, i) => tl.fromTo(f, { opacity: 0, y: -60, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out", immediateRender: true }, C.fork[0] + 0.5 + i * 0.07));

      // price: the dashboard gives way to the comparison
      OUT("#app", C.price[0] + 0.05);
      IN("#price", C.price[0], { x: 0, y: 24 });
      gsap.utils.toArray("#price .pr").forEach((r, i) => tl.fromTo(r.querySelector(".b"), { scaleX: 0 }, { scaleX: 1, duration: i > 1 ? 0.7 : 0.4, ease: "expo.out", immediateRender: true }, C.price[0] + 0.3 + i * 0.18));
      OUT("#price", C.why[0] - 0.4);

      // close: the address types into a bar
      IN("#url", C.url[0] - 0.3, { y: 30, scale: 0.96 });
      const utx = document.getElementById("utx"), U = "tryjasmine.dev", p = { n: 0 };
      tl.fromTo(p, { n: 0 }, { n: U.length, duration: 0.6, ease: "none", immediateRender: false, onUpdate: () => (utx.textContent = U.slice(0, Math.round(p.n))) }, C.url[0]);
      tl.set(p, { n: U.length, onComplete: () => (utx.textContent = U) }, C.url[0] + 0.62);
      IN("#urlsub", C.url[0] + 0.5, { y: 16 });
      window.__timelines["ui"] = tl;
    })();
